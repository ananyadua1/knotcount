<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete your KnotCount account</title>
<style>body{margin:0;background:#F4EFE6;color:#1A1714;font:16px/1.5 system-ui,sans-serif}main{max-width:460px;margin:0 auto;padding:32px 22px}input,button{width:100%;box-sizing:border-box;font:inherit;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #DCD4C6}button{background:#7B1E3A;color:#fff;border:0;cursor:pointer}#msg{margin-top:14px}</style></head>
<body><main>
<h1>Delete your KnotCount account</h1>
<p>Enter your account email and password. This permanently deletes your account, wedding details, guest list and all guest replies. It cannot be undone.</p>
<form id="f"><input id="e" type="email" placeholder="Email" required autocomplete="username"><input id="p" type="password" placeholder="Password" required autocomplete="current-password"><button>Permanently delete my account</button></form>
<div id="msg" role="status"></div>
<script>
document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();var m=document.getElementById('msg');m.textContent='Deleting…';
try{var r=await fetch('/api/account/delete-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});var j=await r.json();
m.textContent=r.ok?'Your account and all its data have been deleted.':(j.error||'Something went wrong.');if(r.ok)f.reset()}catch(x){m.textContent='Could not reach the server.'}};
</script></main></body></html>
