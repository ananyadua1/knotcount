<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You’re invited</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4EFE6;--card:#FBF8F2;--ink:#1A1714;--soft:#4B453D;--muted:#8A8277;--line:#DCD4C6;--wash:#EAE3D5;--sindoor:#B8342B;--leaf:#3E6A4D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 22px 60px}
.label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hero{background:var(--card);border:1px solid var(--ink);border-radius:22px;padding:8px;margin:18px 0 26px;box-shadow:0 6px 14px rgba(58,47,28,.07)}
.hero>div{border:1px solid var(--line);border-radius:16px;padding:30px 20px;text-align:center}
.inv{font:italic 400 52px/1.05 Fraunces,Georgia,serif;margin:14px 0 0}
.names{font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--sindoor);margin-top:16px}
.rule{width:28px;height:1.5px;background:var(--ink);margin:16px auto}
.meta{font-weight:500;font-size:13.5px}.meta.m{color:var(--muted);margin-top:2px}
h2{font-weight:800;font-size:32px;line-height:1.03;letter-spacing:-.04em;text-transform:uppercase;margin:34px 0 0}
.hi{color:var(--soft);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.row{display:flex;gap:10px}
.yn{flex:1;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:800 14px Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.yn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.count{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.big{font-size:76px;font-weight:400;letter-spacing:-.05em;line-height:1}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);background:none;font-size:22px;color:var(--ink);cursor:pointer}
.round.s{background:var(--ink);color:var(--card)}
.meals{display:flex;gap:12px;margin-top:14px}
.meal{flex:1;border:1px solid var(--line);border-radius:18px;padding:18px 8px 14px;text-align:center;background:var(--paper);cursor:pointer;font:inherit;color:inherit}
.meal.on{background:var(--card);border:1.5px solid var(--ink)}
.meal b{display:block;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px}
.sel{display:inline-flex;align-items:center;gap:8px;margin-top:14px}
.rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.meal.on .rd{background:var(--ink);border-color:var(--ink)}
.clock{display:block;margin:6px auto 0}
.time{font-weight:800;font-size:42px;letter-spacing:-.05em;text-align:center;margin-top:8px}
.step{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:8px}
.go{width:100%;height:54px;border-radius:27px;background:var(--ink);color:var(--card);border:0;font:600 12.5px Inter;letter-spacing:.18em;text-transform:uppercase;margin-top:30px;cursor:pointer}
.go[disabled]{opacity:.5}
.sec{margin-top:30px}
.done{text-align:center;padding:36px 10px}
.tick{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--card);display:inline-grid;place-items:center;font-size:22px}
.err{color:var(--sindoor);text-align:center;margin-top:14px;font-weight:500}
.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink);width:auto;padding:0 26px;margin-top:22px}
.hidden{display:none}
</style>
</head>
<body>
<main id="app"><p class="label" style="text-align:center;margin-top:80px">Loading…</p></main>
<script>
const token = location.pathname.split('/').pop();
const app = document.getElementById('app');
const S = { yes: true, count: 1, meal: 'veg', mins: 19 * 60, data: null, done: false, busy: false };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = m => { const h = Math.floor(m / 60) % 24, mm = m % 60; return `${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };

function parseTime(t) {
  const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(t || '');
  if (!m) return 19 * 60;
  let h = +m[1]; const min = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
  return (h % 24) * 60 + min;
}

function clock(mins) {
  const cx = 100, cy = 100, h = Math.floor(mins / 60), mi = mins % 60;
  const pt = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  let t = '';
  for (let i = 0; i < 12; i++) { const M = i % 3 === 0, a = i * 30, p1 = pt(a, M ? 78 : 83), p2 = pt(a, 90);
    t += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#1A1714" stroke-width="${M ? 3 : 1.2}" stroke-linecap="round"/>`; }
  const ma = mi / 60 * 360, ha = (((h % 12) + mi / 60) / 12) * 360, m = pt(ma, 72), hh = pt(ha, 48), tl = pt(ha + 180, 10);
  return `<svg class="clock" width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="97" fill="none" stroke="#1A1714" stroke-width="1.6"/>${t}
  <line x1="100" y1="100" x2="${m[0]}" y2="${m[1]}" stroke="#1A1714" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="${tl[0]}" y1="${tl[1]}" x2="${hh[0]}" y2="${hh[1]}" stroke="#1A1714" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="4.5" fill="#1A1714"/></svg>`;
}
const plate = veg => `<svg width="112" height="63" viewBox="0 0 150 84" fill="none" stroke="#1A1714" stroke-width="1.4" stroke-linecap="round">
 <path d="M14 6v24c0 4 3 6 6 6v40M14 6v18M20 6v18M26 6v24c0 4-3 6-6 6"/><circle cx="75" cy="42" r="36"/><circle cx="75" cy="42" r="27"/>
 <rect x="63" y="30" width="24" height="24" rx="4"/>${veg ? '<circle cx="75" cy="42" r="5" fill="#3E6A4D" stroke="none"/>' : '<path d="M75 35.5l6 10h-12z" fill="#B8342B" stroke="none"/>'}
 <path d="M136 6c-5 3-7 12-7 20 0 5 2 7 5 7v43"/></svg>`;

function render() {
  const d = S.data, e = d.event, g = d.guest, first = esc(g.name.split(' ')[0]);
  const hero = `<p class="label" style="text-align:center">${esc((e.bride[0]||'')+' & '+(e.groom[0]||''))}</p>
  <div class="hero"><div><div class="inv">You’re<br>invited</div><div class="names">${esc(e.bride)} &amp; ${esc(e.groom)}</div><div class="rule"></div>
  <div class="meta">${esc(e.date)}${e.time ? ' · ' + esc(e.time) : ''}</div><div class="meta m">${esc(e.venue)}</div></div></div>`;
  if (S.done) {
    app.innerHTML = hero + `<div class="card done"><div class="tick">✓</div><p class="label" style="margin-top:16px;color:var(--ink);font-weight:800">Thank you, ${first}</p>
    <p style="color:var(--soft);margin:8px 0 0">${S.yes ? `We’ve noted ${S.count} of you coming${S.mins ? ' around ' + fmt(S.mins) : ''}. See you there!` : 'We’ll miss you. Thank you for letting us know.'}</p>
    <button class="go ghost" id="again">Change my reply</button></div>`;
    document.getElementById('again').onclick = () => { S.done = false; render(); };
    return;
  }
  const max = g.seats + 4;
  app.innerHTML = hero + `<h2>Hi ${first},<br>will you attend?</h2>
  <p class="hi">${g.status !== 'pending' ? 'You’ve already replied. You can change it below.' : 'Please let us know so we can plan for you.'}</p>
  <div class="row" style="margin-top:18px"><button class="yn ${S.yes ? 'on' : ''}" data-yn="1">Yes</button><button class="yn ${!S.yes ? 'on' : ''}" data-yn="0">No</button></div>
  <div class="${S.yes ? '' : 'hidden'}">
   <div class="sec"><span class="label">Number of guests</span>
    <div class="count"><button class="round" data-c="-1">−</button><div class="big">${S.count}</div><button class="round s" data-c="1">+</button></div>
    <p style="text-align:center;color:var(--muted);font-size:12.5px;margin:2px 0 0">Invited for ${g.seats} ${g.seats > 1 ? 'seats' : 'seat'}</p></div>
   <div class="sec"><span class="label">Food preference</span><div class="meals">
    ${[['veg', 'Vegetarian'], ['nonveg', 'Non-veg']].map(([k, t]) => `<button class="meal ${S.meal === k ? 'on' : ''}" data-m="${k}">${plate(k === 'veg')}<b>${t}</b><span class="sel"><i class="rd"></i><span class="label" style="font-size:9.5px">${S.meal === k ? 'Selected' : 'Select'}</span></span></button>`).join('')}</div></div>
   <div class="sec"><span class="label">Expected arrival</span>${clock(S.mins)}<div class="time">${fmt(S.mins)}</div>
    <div class="step"><button class="round" data-t="-30">−</button><span class="label">± 30 min</span><button class="round s" data-t="30">+</button></div></div>
  </div>
  <button class="go" id="go" ${S.busy ? 'disabled' : ''}>${S.yes ? `Confirm · ${S.count} ${S.count > 1 ? 'guests' : 'guest'}` : 'Confirm · not attending'}</button><div class="err" id="err"></div>`;
  app.querySelectorAll('[data-yn]').forEach(b => b.onclick = () => { S.yes = b.dataset.yn === '1'; render(); });
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.count = Math.min(max, Math.max(1, S.count + +b.dataset.c)); render(); });
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.meal = b.dataset.m; render(); });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.mins = (S.mins + +b.dataset.t + 1440) % 1440; render(); });
  document.getElementById('go').onclick = submit;
}

async function submit() {
  S.busy = true; render();
  try {
    const r = await fetch(`/api/public/${token}/rsvp`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ attending: S.yes, count: S.count, meal: S.meal, arrival: S.mins }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Something went wrong');
    S.done = true; S.busy = false; render();
  } catch (e) { S.busy = false; render(); document.getElementById('err').textContent = e.message + '. Please try again.'; }
}

(async () => {
  try {
    const r = await fetch(`/api/public/${token}`); const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    S.data = j; const g = j.guest;
    S.yes = g.status !== 'declined'; S.count = g.attending || Math.min(g.seats, g.seats); S.meal = g.meal || 'veg';
    S.mins = g.arrival != null ? g.arrival : parseTime(j.event.time);
    document.title = `You’re invited · ${j.event.bride} & ${j.event.groom}`;
    render();
  } catch (e) {
    app.innerHTML = `<p class="label" style="text-align:center;margin-top:90px">${esc(e.message || 'This invitation link is not valid.')}</p>`;
  }
})();
</script>
</body>
</html>
